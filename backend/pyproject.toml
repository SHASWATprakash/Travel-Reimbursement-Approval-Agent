[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-reimbursement-companion"
version = "0.1.0"
description = "Policy-grounded LangChain and MCP travel reimbursement companion"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.13.5", "langchain==1.4.3", "langchain-core==1.6.6",
  "langchain-ollama==1.1.0", "ollama==0.6.3", "mcp==1.30.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
